<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reveal</title>
    <link rel="icon" type="image/png" href="./assets/reveal-logo.png" />
    <link rel="preload" as="image" href="./assets/bg-4.jpg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="panel controls" id="controls">
      <button class="panel-head" id="panelToggle" type="button" aria-expanded="true" aria-controls="panelBody">
        <span>Settings</span>
        <svg
          class="chev"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          aria-hidden="true"
        >
          <path
            d="M6 9l6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <div class="panel-body" id="panelBody">
        <div class="panel-inner">
          <hr class="panel-divider" />
  
          <div class="preset-row">
            <label>Presets</label>
            <div class="presets" id="presets">
              <button class="preset selected" data-src="./assets/bg-4.jpg">
                <img src="./assets/thumbs/bg-4.jpg" alt="Preset 1" />
              </button>
              <button class="preset" data-src="./assets/bg-2.jpg">
                <img src="./assets/thumbs/bg-2.jpg" alt="Preset 2" />
              </button>
              <button class="preset" data-src="./assets/bg-9.jpg">
                <img src="./assets/thumbs/bg-9.jpg" alt="Preset 3" />
              </button>
            </div>
          </div>
  
          <div class="field row height">
            <label for="bgColor">Color</label>
            <input id="bgColor" type="color" value="#ffffff" />
          </div>
  
          <div class="field row height">
            <label for="imageInput">Image</label>
            <label class="file-btn">
              <input id="imageInput" type="file" accept="image/*" hidden />
              <img id="imagePreview" src="./assets/thumbs/bg-4.jpg" alt="Preview" />
            </label>
          </div>
  
          <div class="field height">
            <label for="radius">Radius</label>
            <input id="radius" type="range" min="10" max="200" step="1" />
          </div>
  
          <div class="field height">
            <label for="pixelSize">Size</label>
            <input id="pixelSize" type="range" min="2" max="60" step="1" />
          </div>
  
        <button class="reset-btn" id="resetImage" type="button">Reset</button>
        </div>
      </div>
    </div>
    <div class="container">
      <canvas id="pixelCanvas"></canvas>
    </div>

    <script src="script.js"></script>
  </body>
</html>
